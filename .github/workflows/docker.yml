name: Build and push image

# Publishes ghcr.io/michael-dial/athleteos:latest (and :sha-<short>) on every
# push to main, mirroring HPC-Validation-Hub's build-and-push.yml: a running
# stack pulls an image CI built rather than building on the host, and the
# homelab watchtower (global scope, 5-minute schedule) picks up new digests
# automatically. Merging to main IS the deploy step.
#
# Hosted runner on purpose: this repo is PUBLIC, so hosted minutes are free
# and the build never touches the homelab docker daemon (a self-hosted build
# here has starved the whole container before — see the CT-103 I/O-storm
# history in the homelab skill). If GitHub ever refuses hosted capacity for
# this repo, switch runs-on to the self-hosted expression used by
# HPC-Validation-Hub.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./src
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
