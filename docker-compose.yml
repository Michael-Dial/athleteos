# AthleteOS — single compose stack. App serves 0.0.0.0:3020 (reserved).
# Open Wearables backend already runs separately at http://192.168.8.222:8000
# and is NOT part of this compose file. Secrets live in .env (see .env.example).
name: athleteos

services:
  app:
    build: ./src
    container_name: athleteos-app
    ports:
      - "0.0.0.0:3020:3020"
    env_file: .env
    environment:
      - PORT=3020
      - OW_API_BASE=${OW_API_BASE:-http://192.168.8.222:8000/api/v1}
      - DATABASE_URL=postgresql://athleteos:${POSTGRES_PASSWORD:-athleteos}@db:5432/athleteos
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: athleteos-db
    environment:
      - POSTGRES_USER=athleteos
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-athleteos}
      - POSTGRES_DB=athleteos
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athleteos"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
