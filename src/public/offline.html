<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · AthleteOS</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --ink: #0b0b0b; --muted: #6e6c67; --accent: #2a78d6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d0d0d; --ink: #f0efec; --muted: #9a988f; --accent: #3987e5; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; text-align: center; }
  h1 { font-size: 20px; margin: 12px 0 4px; }
  p { color: var(--muted); margin: 0 0 16px; max-width: 32ch; }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" width="56" height="56" alt="">
    <h1>You're offline</h1>
    <p>AthleteOS needs a connection to your server. Your data is safe there; reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
